name: Scorecard
# OpenSSF Scorecard: the project's supply-chain posture, measured in public. Publishes
# results to the public Scorecard API and uploads SARIF to GitHub code scanning.
on:
  branch_protection_rule:
  schedule:
    - cron: '30 5 * * 1'   # weekly, Monday 05:30 UTC
  push:
    branches: [main]

# Least privilege by default; the analysis job opts into exactly what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Results can only be published from the canonical repository, not from forks.
    if: github.repository == 'MaxsysLab/skillwarden'
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish results to the public Scorecard API
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results lights up the README badge; it needs id-token: write.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
